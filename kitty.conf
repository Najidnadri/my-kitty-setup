# kitty.conf — ported from gnome-terminal (Catppuccin Mocha + JetBrainsMono).
# Generated to match the prior gnome-terminal profile 1:1.

# ── Font ─────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ── Cursor ───────────────────────────────────────────────────────────
cursor_shape           block
cursor_blink_interval  0

# ── Scrollback ───────────────────────────────────────────────────────
scrollback_lines 10000

# ── Window / bell ────────────────────────────────────────────────────
window_padding_width    4
confirm_os_window_close 0
enable_audio_bell       no
# Inline images "just work" via kitty's graphics protocol (built in).

# ── Keybindings (gnome-terminal muscle memory) ───────────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+q close_os_window
map ctrl+page_up   previous_tab
map ctrl+page_down next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+right next_tab
map ctrl+shift+plus  change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0
# Splits (extra niceties gnome-terminal lacked)
map ctrl+shift+enter new_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window

# ── Catppuccin Mocha ─────────────────────────────────────────────────
foreground            #CDD6F4
background            #1E1E2E
selection_foreground  #1E1E2E
selection_background  #F5E0DC
